# Configuration locale de l'interface : aucun secret ici.
[server]
# Écoute en local seulement : l'URL réseau exposerait l'app (et le quota Bedrock partagé).
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[client]
# Pas de trace Python (chemins locaux) affichée dans l'interface.
showErrorDetails = "none"
# Navigation multipage déclarée par st.navigation dans app/streamlit_app.py.
showSidebarNavigation = true

# Thème clair et sobre : bleu profond pour l'action, gris bleutés pour les surfaces.
# Les couleurs de statut (vert, orange, rouge, gris) restent toujours accompagnées d'un libellé.
[theme]
base = "light"
primaryColor = "#1D4E89"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#1A2332"
linkColor = "#1D4E89"
borderColor = "#DDE3EA"
showWidgetBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
font = "sans-serif"
baseFontSize = 15
greenColor = "#2E8B57"
orangeColor = "#D9822B"
redColor = "#C62828"
blueColor = "#1D4E89"

[theme.sidebar]
backgroundColor = "#F3F6FA"
